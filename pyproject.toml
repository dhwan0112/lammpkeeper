# Build through setuptools without importing optional simulation/plotting tools.
# The pure-Python wheel remains usable when the native extension is not built.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Core installation intentionally needs only NumPy. Version resolution below
# reads the shared constant so legacy packages and the dispatcher cannot drift.
[project]
name = "lammpkeeper"
dynamic = ["version"]
description = "LammpKeeper (lkpr): unified LAMMPS pre/post-processing CLI for iron-redox MLFF studies"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
]

# prep (lammps-pre) and post (lammps-post) have disjoint heavy dependencies,
# so they are split into extras. Install only what a given task needs:
#   pip install -e .[prep]   # structure/input generation (ASE)
#   pip install -e .[post]   # analysis/plotting (MDAnalysis, scipy, pandas, matplotlib)
#   pip install -e .[all]    # everything
[project.optional-dependencies]
prep = ["ase"]
post = ["matplotlib", "scipy", "pandas", "MDAnalysis"]
all = ["ase", "matplotlib", "scipy", "pandas", "MDAnalysis", "rich"]
dev = ["pytest"]

# The console script is a router, not another copy of prep/post option parsing.
[project.scripts]
lkpr = "lammpkeeper.cli:main"

# Tests also run without pytest: `python tests/run.py` (numpy-only).
# Slower RDF/MSD golden checks are opt-in: LKPR_SLOW=1.
[tool.pytest.ini_options]
testpaths = ["tests"]

# Stage 1 keeps the original packages in place (no file moves). The legacy
# entry points remain available unchanged:
#   python -m lammps_pre ...   / python lammps-pre.py ...
#   python -m lammps_post ...  / python lammps-post.py ...
[tool.setuptools.dynamic]
version = {attr = "lammpkeeper.VERSION"}

# Explicit inclusion keeps both historical import paths in the distribution;
# moving files requires a separate migration/deprecation decision.
[tool.setuptools]
packages = ["lammpkeeper", "lammpkeeper.common", "lammpkeeper.core", "lammps_pre", "lammps_post"]
